name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Шаг 1: Распаковываем ваш архив SatAligner.zip
    - name: Unzip Project
      run: |
        unzip SatAligner.zip -d ./Unpacked
        # Автоматически находим корневую директорию, где лежит папка app
        APP_ROOT=$(find ./Unpacked -name "AndroidManifest.xml" -exec dirname {} \; | head -n 1 | sed 's/\/src\/main//')
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    # Шаг 2: Настраиваем Java окружение
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Шаг 3: Исправление имен ресурсов и прямая сборка через Android SDK Tools
    - name: Fix Resources and Compile App
      run: |
        # 1. Находим системную библиотеку Android на сервере GitHub
        SDK_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        echo "Using Android SDK: $SDK_JAR"
        
        # Создаем чистые рабочие каталоги для компиляции
        mkdir -p buildgen/obj buildgen/apk buildgen/res_fixed buildgen/gen
        
        # 2. Исправляем баг кодировки/регистра: копируем ресурсы, переводя имена файлов в нижний регистр
        cp -r ${{ env.APP_ROOT }}/src/main/res/* buildgen/res_fixed/
        find buildgen/res_fixed -type f | while read file; do
          dir=$(dirname "$file")
          base=$(basename "$file")
          lower_base=$(echo "$base" | tr '[:upper:]' '[:lower:]')
          if [ "$base" != "$lower_base" ]; then
            mv "$file" "$dir/$lower_base"
          fi
        done
        
        # 3. Компилируем XML ресурсы и разметку интерфейса через AAPT2
        aapt2 compile --dir buildgen/res_fixed -o buildgen/res.zip
        aapt2 link --manifest ${{ env.APP_ROOT }}/src/main/AndroidManifest.xml -I "$SDK_JAR" -o buildgen/apk/base.apk buildgen/res.zip --java buildgen/gen
        
        # 4. Компилируем весь исходный Java-код в байт-код (Java 8)
        find ${{ env.APP_ROOT }}/src/main/java buildgen/gen -name "*.java" > buildgen/sources.txt
        javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$SDK_JAR" -d buildgen/obj @buildgen/sources.txt
        
        # 5. Конвертируем скомпилированные классы в формат Android DEX (classes.dex)
        cd buildgen/obj
        zip -r ../classes.zip ./* > /dev/null
        cd ../..
        d8 --output buildgen/apk/classes.dex buildgen/classes.zip --lib "$SDK_JAR"
        
        # 6. Упаковываем все компоненты в финальный APK-пакет и подписываем его
        cd buildgen/apk
        zip -r ../../SatAligner_Compiled.apk ./* > /dev/null
        cd ../..
        apksigner debug SatAligner_Compiled.apk

    # Шаг 4: Выкладываем готовый APK-файл в артефакты GitHub для скачивания
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: SatAligner-Installable-APK
        path: SatAligner_Compiled.apk
