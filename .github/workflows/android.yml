name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Шаг 1: Распаковываем ваш архив SatAligner.zip прямо на сервере
    - name: Unzip Project Files
      run: |
        unzip SatAligner.zip -d ./UnpackedProject
        # Проверяем, куда именно распаковались файлы, и выводим структуру для отладки
        ls -la ./UnpackedProject
        
    # Шаг 2: Настраиваем Java 17 для чистой компиляции
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Шаг 3: Даем права на запуск скрипта сборщика внутри распакованной папки
    - name: Grant execute permission for gradlew
      run: |
        if [ -f "./UnpackedProject/SatAligner/gradlew" ]; then
          chmod +x ./UnpackedProject/SatAligner/gradlew
        else
          chmod +x ./UnpackedProject/gradlew
        fi

    # Шаг 4: Собираем проект с помощью Gradle, автоматически определяя точный путь к распакованной папке
    - name: Build with Gradle
      run: |
        if [ -d "./UnpackedProject/SatAligner" ]; then
          cd ./UnpackedProject/SatAligner && ./gradlew assembleDebug --no-daemon
        else
          cd ./UnpackedProject && ./gradlew assembleDebug --no-daemon
        fi

    # Шаг 5: Забираем готовый APK-файл и выкладываем его на страницу скачивания
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SatAligner-Ready-To-Install
        path: |
          ./UnpackedProject/SatAligner/app/build/outputs/apk/debug/app-debug.apk
          ./UnpackedProject/app/build/outputs/apk/debug/app-debug.apk
