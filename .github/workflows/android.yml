name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Run Build
      run: |
        unzip SatAligner.zip -d ./Unpacked
        APP_ROOT=$(find ./Unpacked -name "java" -exec dirname {} \; | head -n 1)
        SDK_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -type d | sort -V | tail -n 1)
        mkdir -p buildgen/obj buildgen/apk buildgen/res_fixed buildgen/gen
        
        echo '<?xml version="1.0" encoding="utf-8"?><manifest xmlns:android="http://android.com" package="com.example.sataligner"><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.CAMERA"/><uses-feature android:name="android.hardware.sensor.gyroscope" android:required="true"/><uses-feature android:name="android.hardware.sensor.accelerometer" android:required="true"/><application android:allowBackup="true" android:label="Sat Aligner"><activity android:name="com.example.sataligner.MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><activity android:name="com.example.sataligner.SunCalibrationActivity" android:exported="true"/><activity android:name="com.example.sataligner.GpsCalibrationActivity" android:exported="true"/><activity android:name="com.example.sataligner.GuidanceActivity" android:exported="true"/></application></manifest>' > buildgen/AndroidManifest.xml
        
        if [ -d "$APP_ROOT/res" ]; then cp -r $APP_ROOT/res/* buildgen/res_fixed/; fi
        $BUILD_TOOLS_DIR/aapt2 compile --dir buildgen/res_fixed -o buildgen/res.zip
        $BUILD_TOOLS_DIR/aapt2 link --manifest buildgen/AndroidManifest.xml -I "$SDK_JAR" -o buildgen/apk/base.apk buildgen/res.zip --java buildgen/gen
        find $APP_ROOT/java buildgen/gen -name "*.java" > buildgen/sources.txt
        javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$SDK_JAR" -d buildgen/obj @buildgen/sources.txt
        cd buildgen/obj && zip -r ../classes.zip ./* > /dev/null && cd ../..
        $BUILD_TOOLS_DIR/d8 --output buildgen/apk/classes.dex buildgen/classes.zip --lib "$SDK_JAR"
        cd buildgen/apk && zip -r ../../SatAligner_Compiled.apk ./* > /dev/null && cd ../..
        $BUILD_TOOLS_DIR/apksigner debug SatAligner_Compiled.apk

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: SatAligner-Installable-APK
        path: SatAligner_Compiled.apk
