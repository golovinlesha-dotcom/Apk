name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Шаг 1: Распаковываем ваш архив SatAligner.zip
    - name: Unzip Project
      run: |
        unzip SatAligner.zip -d ./Unpacked
        APP_ROOT=$(find ./Unpacked -name "java" -exec dirname {} \; | head -n 1)
        echo "APP_ROOT=$APP_ROOT" >> $GITHUB_ENV

    # Шаг 2: Настраиваем Java окружение
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Шаг 3: Монолитная сборка приложения через нативные инструменты Android SDK
    - name: Compile Application
      run: |
        SDK_JAR=$(find $ANDROID_HOME/platforms/ -name "android.jar" | sort -V | tail -n 1)
        BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools/ -maxdepth 1 -type d | sort -V | tail -n 1)
        echo "Using Android SDK: $SDK_JAR"
        echo "Using Build Tools: $BUILD_TOOLS_DIR"
        
        mkdir -p buildgen/obj buildgen/apk buildgen/res_fixed buildgen/gen
        
        # Запись идеальной структуры манифеста. Строки ниже НАМЕРЕННО прижаты к левому краю, чтобы исключить баги пробелов YAML!
        cat << 'EOF' > buildgen/AndroidManifest.xml
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://android.com" package="com.example.sataligner">
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.sensor.gyroscope" android:required="true" />
    <uses-feature android:name="android.hardware.sensor.accelerometer" android:required="true" />
    <application android:allowBackup="true" android:label="Sat Aligner">
        <activity android:name="com.example.sataligner.MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
        <activity android:name="com.example.sataligner.SunCalibrationActivity" android:exported="true" />
        <activity android:name="com.example.sataligner.GpsCalibrationActivity" android:exported="true" />
        <activity android:name="com.example.sataligner.GuidanceActivity" android:exported="true" />
    </application>
</manifest>
EOF

        # Проверяем структуру сгенерированного файла в логе
        cat buildgen/AndroidManifest.xml

        # Копируем графические ресурсы
        if [ -d "${{ env.APP_ROOT }}/res" ]; then
          cp -r ${{ env.APP_ROOT }}/res/* buildgen/res_fixed/
        fi
        
        # Безопасное переименование папок в нижний регистр для aapt2
        find buildgen/res_fixed -type f -exec sh -c '
          for f; do
            dir=$(dirname "$f")
            base=$(basename "$f")
            lower=$(echo "$base" | tr "[:upper:]" "[:lower:]")
            if [ "$base" != "$lower" ]; then
              mv "$f" "$dir/$lower"
            fi
          done
        ' _ {} +
        
        # 4. Компилируем ресурсы интерфейса через AAPT2
        $BUILD_TOOLS_DIR/aapt2 compile --dir buildgen/res_fixed -o buildgen/res.zip
        $BUILD_TOOLS_DIR/aapt2 link --manifest buildgen/AndroidManifest.xml -I "$SDK_JAR" -o buildgen/apk/base.apk buildgen/res.zip --java buildgen/gen
        
        # 5. Сборка Java-кода в байт-код (Java 8)
        find ${{ env.APP_ROOT }}/java buildgen/gen -name "*.java" > buildgen/sources.txt
        javac -encoding UTF-8 -source 1.8 -target 1.8 -bootclasspath "$SDK_JAR" -d buildgen/obj @buildgen/sources.txt
        
        # 6. Трансляция скомпилированных классов в формат Android DEX (classes.dex)
        cd buildgen/obj && zip -r ../classes.zip ./* > /dev/null && cd ../..
        $BUILD_TOOLS_DIR/d8 --output buildgen/apk/classes.dex buildgen/classes.zip --lib "$SDK_JAR"
        
        # 7. Финальная упаковка в APK и подпись отладочным ключом
        cd buildgen/apk && zip -r ../../SatAligner_Compiled.apk ./* > /dev/null && cd ../..
        $BUILD_TOOLS_DIR/apksigner debug SatAligner_Compiled.apk

    # Шаг 4: Выгрузка готового APK для скачивания
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: SatAligner-Installable-APK
        path: SatAligner_Compiled.apk
